name: Build GodEx for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows app
        run: dotnet publish GodEx.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GodEx-Windows-x64
          path: publish/GodEx.exe
          if-no-files-found: error
          retention-days: 14
